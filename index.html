<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salma &amp; Ahmed – Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Pinyon+Script&family=Great+Vibes&family=Sacramento&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8ec;--card:#fffdf6;--ink:#7a2a22;--red:#a02a1a;--rose:#c8454a;--olive:#8a9a3b;--sun:#f0a030;--line:#e8dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.6;text-align:center}
h1,h2,.script{font-family:Sacramento,cursive;font-weight:400;color:var(--red);margin:0}
h1{font-size:clamp(3.2rem,13vw,6rem);line-height:1}h2{font-size:2.6rem;margin-bottom:.4rem}
section{max-width:640px;margin:0 auto;padding:3.5rem 1.4rem}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}
.hero p{letter-spacing:.2em;text-transform:uppercase;font-size:.8rem}
.amp{font-family:Sacramento,cursive;font-size:3rem;color:var(--sun)}
.candle{position:absolute;bottom:0;width:60px;opacity:.9}.c1{left:4%}.c2{left:calc(4% + 70px);width:44px}
.sun{position:absolute;top:8%;right:8%;width:70px;opacity:.9}
.div{height:14px;background:repeating-linear-gradient(90deg,var(--sun) 0 6px,transparent 6px 12px);opacity:.5;max-width:200px;margin:0 auto}
.diamonds{height:26px;margin:0 auto;max-width:220px;background:linear-gradient(135deg,transparent 45%,var(--rose) 46% 54%,transparent 55%) 0 0/26px 26px,linear-gradient(45deg,transparent 45%,var(--rose) 46% 54%,transparent 55%) 0 0/26px 26px;opacity:.7}
.grid{display:grid;gap:1rem;margin-top:1.4rem}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem}
.card b{display:block;font-family:Sacramento,cursive;font-size:1.9rem;color:var(--red);font-weight:400}
.btn{display:inline-block;background:var(--red);color:#fffdf6;border:0;border-radius:99px;padding:.8rem 1.8rem;font:400 1rem Jost,sans-serif;letter-spacing:.06em;text-decoration:none;cursor:pointer;margin-top:1rem}
.btn.alt{background:transparent;color:var(--red);border:1px solid var(--red)}
.sw{display:flex;justify-content:center;gap:.6rem;margin-top:1rem}.sw i{width:30px;height:30px;border-radius:50%}
form{text-align:left;margin-top:1.4rem}label{display:block;margin:1rem 0 .3rem;font-size:.9rem}
input[type=text]{width:100%;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:300 1rem Jost,sans-serif}
.opts{display:flex;gap:.6rem;flex-wrap:wrap}.opts label{margin:0;flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;cursor:pointer;background:var(--card)}
.opts input{accent-color:var(--rose);margin-right:.4rem}
#plus{display:none}#msg{margin-top:1rem;text-align:center}
.tbl{overflow-x:auto;text-align:left}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
.stats{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem}
footer{padding:2rem 1rem;font-size:.85rem;opacity:.8}

section{max-width:none;padding:4rem max(1.4rem,calc(50% - 320px))}

.names{font-family:'Great Vibes','Sacramento',cursive;font-weight:400;font-size:2.9rem;line-height:1.2;margin:1.6rem 0 .8rem}
.when{letter-spacing:.03em;margin:0;font-size:.95rem;white-space:nowrap}
#names{background:#9b2f3a;color:#f5d9d0}
.sunimg{width:120px;display:block;margin:0 auto 1rem}
.join{margin:2rem 0 .2rem;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem}
.date{font-family:Jost,system-ui,sans-serif;font-weight:600;letter-spacing:.06em;font-size:2.3rem;line-height:1.2;color:var(--red);padding:.7rem 0;margin:0 auto;max-width:340px;border-top:1px solid var(--rose);border-bottom:1px solid var(--rose)}
.where{margin:1.2rem 0 1.4rem;font-size:1.1rem;letter-spacing:.08em;line-height:1.8}

#names h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:2.6rem;line-height:1.15;letter-spacing:.05em;margin:0 0 1.2rem}
#names .sub{font-family:'Pinyon Script','Great Vibes',cursive;font-size:1.7rem;line-height:1.3;margin:0 0 1.2rem}
.orn{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:0 auto 1.6rem;max-width:210px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--rose);opacity:.7}
.orn i{width:7px;height:7px;background:var(--rose);transform:rotate(45deg)}
#names .join{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:.85rem;letter-spacing:.3em;margin:0 0 .7rem}
#names .date{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:2rem;letter-spacing:.14em;line-height:1.2;border:0;padding:0;max-width:none;margin:0 0 1.4rem}
#names .venue,#names .time{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;text-transform:uppercase;margin:0}
#names .venue{font-size:1rem;letter-spacing:.26em;margin-bottom:.35rem}
#names .time{font-size:.85rem;letter-spacing:.3em;margin-bottom:1.8rem}
#names .btn{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.22em;font-size:1rem}
#rsvp h2{line-height:1.15;margin-bottom:.8rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-items:stretch;max-width:480px;margin:0 auto}
.duo .card{display:flex;flex-direction:column;align-items:center;font-size:.9rem;line-height:1.5;padding:1rem .8rem}
.duo .btn{margin-top:auto;font-size:.78rem;padding:.6rem 1rem;letter-spacing:.03em;line-height:1.3}
.duo .card b{margin-bottom:.3rem}
.moonimg{width:110px;display:block;margin:2.2rem auto 0}
#names h2,#names p,#names .date{color:#f5d9d0}
#names .orn::before,#names .orn::after,#names .orn i{background:#f5d9d0}
#names .btn{background:#f5d9d0;color:#9b2f3a}
#rsvp{background:#928a39}
#rsvp h2,#rsvp form>label,#rsvp #plus>label,#rsvp #pn>label,#rsvp #msg{color:#fef8ed;font-weight:400}
#rsvp form>label,#rsvp #plus>label,#rsvp #pn>label{font-size:1rem}
#rsvp #go{color:#fef8ed}
/* spacing system: 8px steps, 4rem between sections */
section{padding-top:4rem;padding-bottom:4rem}
#names{padding-top:4rem}
footer{display:none}
h2{line-height:1.15}
#names h2{margin:0 0 1.5rem}
.sunimg{margin:0 auto 1rem}
.orn{margin:0 auto 1.5rem}
#names .join{margin:0 0 .5rem}
#names .date{margin:0 0 1.5rem}
#names .venue{margin:0 0 .5rem}
#names .time{margin:0}
#names .btn{margin-top:2rem}
.duo{gap:1rem}
.moonimg{margin:2rem auto 0}
#rsvp h2{margin:0}
form{margin-top:1.5rem}
label{margin:1rem 0 .5rem}
.opts label{margin:0}
#rsvp form>div[style*="center"]{margin-top:4rem}
#rsvp .btn{margin-top:0}
#rsvp #go{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:.22em;text-transform:uppercase;padding:.8rem 1.8rem;line-height:1.6}
#msg{margin-top:1rem}
#msg:empty{margin:0}

<section id="rsvp" class="wash2">
  <h2>Let us know if you can make it!</h2>
  <form id="f">
    <label for="n">Your full name</label>
    <input type="text" id="n" required maxlength="80" autocomplete="name">
    <label>Will you be joining us?</label>
    <div class="opts">
      <label><input type="radio" name="a" value="Yes" required>Joyfully accept</label>
      <label><input type="radio" name="a" value="No">Regretfully decline</label>
    </div>
    <div id="plus">
      <label>Are you bringing a plus one?</label>
      <div class="opts">
        <label><input type="radio" name="p" value="Yes">Yes</label>
        <label><input type="radio" name="p" value="No" checked>No</label>
      </div>
      <div id="pn" style="display:none"><label for="pname">Plus one's full name</label><input type="text" id="pname" maxlength="80"></div>
    </div>
    <div style="text-align:center"><button class="btn" id="go" type="submit">Send RSVP</button></div>
    <input type="text" id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div id="msg" aria-live="polite"></div>
  </form>
</section>
<section id="pattern" aria-hidden="true"></section>



<footer></footer></div>


<script>
/* ===== PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW ===== */
var SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

(function(){
var $=function(i){return document.getElementById(i)};
var f=$('f'),msg=$('msg');
function sync(){
  var a=f.a.value==='Yes';$('plus').style.display=a?'block':'none';
  var p=a&&f.p.value==='Yes';$('pn').style.display=p?'block':'none';$('pname').required=p;
}
f.addEventListener('change',sync);sync();

f.addEventListener('submit',function(e){
  e.preventDefault();
  if(!SCRIPT_URL||SCRIPT_URL.indexOf('PASTE_')===0){msg.textContent='The RSVP form is not connected yet.';return}
  var a=f.a.value,p=a==='Yes'?f.p.value:'No';
  var body=new URLSearchParams();
  body.append('name',$('n').value.trim());
  body.append('attending',a);
  body.append('plusOne',p);
  body.append('plusOneName',p==='Yes'?$('pname').value.trim():'');
  body.append('website',($('hp')||{}).value||'');
  $('go').disabled=true;msg.textContent='Sending…';
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:body}).then(function(){
    f.style.display='none';msg.textContent='';
    var d=document.createElement('div');d.className='card';d.style.marginTop='1.4rem';
    d.innerHTML='<b class="script" style="font-size:2.4rem;color:var(--red)">'+(a==='Yes'?'Thank you!':'We\'ll miss you')+'</b>'+(a==='Yes'?'Your RSVP is in. See you on December 4th.':'Thanks for letting us know.');
    f.parentNode.appendChild(d);
  },function(){msg.textContent='Something went wrong. Please check your connection and try again.';$('go').disabled=false});
});
})();
</script>
